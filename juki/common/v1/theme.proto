syntax = "proto3";

package protos.juki.common.v1;
option go_package = "juki-engine/protos/juki/common/v1";

import "protos/juki/common/v1/common.proto";


service ThemeService {
  rpc ListThemes (Empty) returns (ListThemesResponse);
  rpc SetTheme (SetThemeRequest) returns (Theme);
}



message SetThemeRequest {
  string id = 1;
}

message ListThemesResponse {
  repeated Theme themes = 1;
}

message Theme {
  string id = 1;
  string name = 2;
  string description = 3;
}