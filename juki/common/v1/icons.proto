syntax = "proto3";

package juki.common.v1;

option go_package = "juki-engine/pkg/gen/juki/common/v1";

service IconService {
  rpc SearchIcons(SearchIconsRequest) returns (SearchIconsResponse);
}

message SearchIconsRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchIconsResponse {
  repeated Icon icons = 1;
}

message Icon {
  string id = 1;
  string name = 2;
  string pack = 3; // material/lucide etc.
  string svg = 4;
}
