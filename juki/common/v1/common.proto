syntax = "proto3";

package juki.common.v1;

option go_package = "juki-engine/pkg/gen/juki/common/v1";

message Empty {}

message Metadata {
  string id = 1;
  string created_at = 2;
  string updated_at = 3;
}

enum PageType {
  PAGE_TYPE_UNSPECIFIED = 0;
  PAGE_TYPE_STATIC = 1;
  PAGE_TYPE_DYNAMIC = 2;
  PAGE_TYPE_CATCH_ALL = 3;
}

enum AccessType {
  ACCESS_TYPE_UNSPECIFIED = 0;
  ACCESS_TYPE_PUBLIC = 1;
  ACCESS_TYPE_PROTECTED = 2;
}
