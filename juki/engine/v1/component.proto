syntax = "proto3";

package protos.juki.engine.v1;
option go_package = "juki-engine/protos/juki/engine/v1";

import "protos/juki/common/v1/common.proto";

service ComponentService {
  rpc CreateComponent (CreateComponentRequest) returns (UserComponent);
  rpc UpdateComponent (UpdateComponentRequest) returns (UserComponent);
  rpc DeleteComponent (DeleteComponentRequest) returns (Empty);
  rpc ListComponents (ListComponentsRequest) returns (ListComponentsResponse);
}

message CreateComponentRequest {
  string project_id = 1;
  string name = 2;
  string content = 3;
}

message UpdateComponentRequest {
  string id = 1;
  string name = 2;
  string content = 3;
}

message DeleteComponentRequest {
  string id = 1;
}

message ListComponentsRequest {
  string project_id = 1;
}

message ListComponentsResponse {
  repeated UserComponent components = 1;
}

message UserComponent {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string content = 4; // JSON stringified component
  Metadata meta = 5;
}