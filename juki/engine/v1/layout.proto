syntax = "proto3";

package juki.engine.v1;
option go_package = "juki-engine/pkg/gen/juki/engine/v1";

import "juki/common/v1/common.proto";

message Layout {
  string id = 1;
  string name = 2;
  string route = 3; // e.g., "app/dashboard"
  string path = 4; // File path "app/dashboard/layout.tsx"
  string content = 5; // JSON stringified layout content
  string parent_layout_id = 6;
  bool is_root = 7;
  juki.common.v1.Metadata meta = 8;
}
