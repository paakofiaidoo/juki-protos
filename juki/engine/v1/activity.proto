syntax = "proto3";

package juki.engine.v1;

option go_package = "juki-engine/pkg/gen/juki/engine/v1";

service ActivityService {
  rpc GetActivityLog(GetActivityLogRequest) returns (GetActivityLogResponse);
  rpc StreamActivityLog(StreamActivityLogRequest) returns (stream StreamActivityLogResponse);
}

// ... ActivityLog definition (keep it, but use in wrapper) ...

message StreamActivityLogResponse {
  ActivityLog log = 1;
}

message ActivityLog {
  string id = 1;
  string method = 2; // e.g., "CreateProject"
  string request_payload = 3; // JSON formatted
  string response_payload = 4; // JSON formatted
  int32 status_code = 5;
  int64 duration_ms = 6;
  string timestamp = 7;
}

message GetActivityLogRequest {
  string project_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetActivityLogResponse {
  repeated ActivityLog logs = 1;
  int32 total = 2;
}

message StreamActivityLogRequest {
  string project_id = 1;
}
