syntax = "proto3";

//package editor.app;
package juki.engine.v1;
option go_package = "juki-engine/pkg/gen/juki/engine/v1";

import "juki/common/v1/common.proto";

service AppService {
  rpc GetAppInfo (juki.common.v1.Empty) returns (AppInfo);
  rpc UpdateAppName (UpdateAppNameRequest) returns (AppInfo);
}



message UpdateAppNameRequest {
  string name = 1;
}

message AppInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  juki.common.v1.Metadata meta = 4;
}