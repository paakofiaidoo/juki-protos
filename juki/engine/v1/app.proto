syntax = "proto3";

//package editor.app;
package protos.juki.engine.v1;
option go_package = "juki-engine/protos/juki/engine/v1";

import "protos/juki/engine/v1/common.proto";

service AppService {
  rpc GetAppInfo (Empty) returns (AppInfo);
  rpc UpdateAppName (UpdateAppNameRequest) returns (AppInfo);
}



message UpdateAppNameRequest {
  string name = 1;
}

message AppInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  Metadata meta = 4;
}