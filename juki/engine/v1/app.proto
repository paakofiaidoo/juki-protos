syntax = "proto3";

//package editor.app;
package juki.engine.v1;

import "juki/common/v1/common.proto";


option go_package = "juki-engine/pkg/gen/juki/engine/v1";

service AppService {
  rpc GetAppInfo(GetAppInfoRequest) returns (GetAppInfoResponse);
  rpc UpdateAppName(UpdateAppNameRequest) returns (UpdateAppNameResponse);
}

message GetAppInfoRequest {}

message GetAppInfoResponse {
  AppInfo app_info = 1;
}

message UpdateAppNameRequest {
  string name = 1;
}

message UpdateAppNameResponse {
  AppInfo app_info = 1;
}

message AppInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  juki.common.v1.Metadata meta = 4;
}
